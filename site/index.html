<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>다인이의 팔로워 기록</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body><main><p class="eyebrow">OUR DAILY RECORD · KST</p><h1 id="title">다인이의 기록</h1><p>하루 한 번, 차곡차곡 쌓이는 변화.</p><p id="status" role="status">기록을 불러오고 있습니다.</p><section class="cards"><article>최근 팔로워<strong id="latest">—</strong></article><article>직전 기록 대비<strong id="delta">—</strong></article><article>기록한 날짜<strong id="total">0</strong></article></section>
<section><div class="tools"><h2>팔로워 추이</h2><label>표시 기간 <select id="range"><option value="all">전체</option><option value="30">최근 30일</option><option value="90">최근 90일</option></select></label></div><p>기록이 없는 날짜는 선을 연결하지 않습니다. 아래 표에서 정확한 값을 확인하세요.</p><svg id="chart" viewBox="0 0 900 300" role="img" aria-label="날짜별 팔로워 수 그래프"></svg></section>
<section><div class="tools"><h2>날짜별 기록</h2><button id="export">CSV 내려받기</button></div><div class="table"><table><thead><tr><th>날짜 (한국)</th><th>팔로워</th><th>기록 방법</th></tr></thead><tbody id="rows"></tbody></table></div></section><footer>공개 계정의 팔로워 총수만 기록합니다. 입력은 저장소의 Actions에서 진행하세요.</footer></main></body></html>
