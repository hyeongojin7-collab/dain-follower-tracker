        <label id="hourly-control" class="date-control" hidden><span class="sr-only">시간별 기록 날짜</span><input type="date" id="hour-date" aria-label="시간별 기록 날짜"></label>
        <span id="chart-detail" class="chart-detail"></span>
      </div>
      <svg id="chart" role="img" aria-label="날짜별 팔로워 수 그래프. 정확한 값은 아래 기록 표에서 확인할 수 있습니다."></svg>
    </section>

    <section class="panel records-panel" aria-labelledby="records-heading">
      <div class="section-heading">
        <h2 id="records-heading">기록</h2>
        <button id="export" type="button"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3v9m-3-3 3 3 3-3M4 13v3h12v-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>CSV 저장</button>
      </div>
      <div class="table-scroll">
        <table><thead><tr><th scope="col" id="time-heading">날짜</th><th scope="col">팔로워</th><th scope="col">변화</th></tr></thead><tbody id="rows"></tbody></table>
      </div>
    </section>
  </main>
</body>
</html>
