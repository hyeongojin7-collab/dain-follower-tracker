name: 팔로워 기록과 대시보드
on:
  workflow_dispatch:
    inputs:
      followers:
        description: '수동 기록할 정확한 팔로워 수 (비우면 설정된 수집 모드 실행)'
        required: false
        type: string
      date:
        description: '수동 기록 날짜 YYYY-MM-DD (비우면 한국 오늘)'
        required: false
        type: string
      replace:
        description: '같은 날짜의 기존 수동 기록을 덮어쓰기'
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tracker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
  record:
    needs: test
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: 공개 페이지 모드일 때만 브라우저 설치
        run: |
          if node -e "process.exit(JSON.parse(require('fs').readFileSync('config.json')).collectionMode === 'public-page' ? 0 : 1)"; then
            npx playwright install --with-deps chromium
          fi
      - name: 수동 입력 또는 자동 수집
        env:
          FOLLOWERS: ${{ inputs.followers }}
          RECORD_DATE: ${{ inputs.date }}
          REPLACE: ${{ inputs.replace }}
          FB_USER_ACCESS_TOKEN: ${{ secrets.FB_USER_ACCESS_TOKEN }}
          FB_CALLER_IG_USER_ID: ${{ secrets.FB_CALLER_IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
        run: |
          if [ -n "$FOLLOWERS" ]; then
            node scripts/record.mjs
          else
            node scripts/collect.mjs
          fi
      - name: 변경된 기록 저장
        run: |
          if [ -n "$(git status --porcelain site/data/history.json site/data/hourly.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/data/history.json site/data/hourly.json
            git commit -m '한국 날짜별 팔로워 기록 갱신'
            git push
          fi
  build:
    permissions:
      contents: read
      pages: read
    needs: [test, record]
    if: always() && needs.test.result == 'success' && (needs.record.result == 'success' || needs.record.result == 'skipped') && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/prepare.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
